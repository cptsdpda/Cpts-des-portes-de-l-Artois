L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',{maxZoom:19,attribution:'© IGN — Géoplateforme'}).addTo(map);

     mi.forEach(function(m,j){m.checked=oi[j].checked});

// Sur mobile, un panneau dédié affiche clairement les 14 professions.
const mobileLayersBtn=document.getElementById('mobileLayersBtn');
const mobilePanel=document.getElementById('mobileProfessionsPanel');
const mobileProfessionList=document.getElementById('mobileProfessionList');
const professionNames=Object.keys(overlays).sort((a,b)=>a.localeCompare(b,'fr'));

function setProfession(profession, checked){
  const g=groups[profession];
  if(checked){
    // Sélection exclusive : une profession choisie désactive toutes les autres.
    Object.keys(groups).forEach(k=>{
      if(k===profession) return;
      if(map.hasLayer(groups[k])) map.removeLayer(groups[k]);
    });
    if(!map.hasLayer(g)) g.addTo(map);
  }else{
    if(map.hasLayer(g)) map.removeLayer(g);
  }
  // Synchronise le panneau mobile et le contrôle Leaflet desktop.
  mobileProfessionList.querySelectorAll('input[data-profession]').forEach(input=>{
    input.checked = map.hasLayer(groups[input.dataset.profession]);
  });
  document.querySelectorAll('.leaflet-control-layers-overlays input').forEach(input=>{
    const label=input.closest('label');
    if(label){
      const name=label.textContent.trim();
      input.checked=map.hasLayer(groups[name]);
    }
  });
}

professionNames.forEach(k=>{
  const label=document.createElement('label');
  label.className='mobile-profession-option';
  label.innerHTML=`<input type="checkbox" data-profession="${esc(k)}" ${map.hasLayer(groups[k])?'checked':''}><span class="mobile-profession-dot" style="background:${colors[k]}"></span><span>${esc(k)}</span>`;
  label.querySelector('input').addEventListener('change',function(){setProfession(k,this.checked);});
  mobileProfessionList.appendChild(label);
});

if(mobileLayersBtn){
  mobileLayersBtn.addEventListener('click',()=>{
    const open=mobilePanel.classList.toggle('open');
    mobilePanel.setAttribute('aria-hidden',String(!open));
    mobileLayersBtn.innerHTML=open
      ? '<span class="layers-icon">✕</span><span>Fermer les professions</span>'
      : '<span class="layers-icon">☰</span><span>Professions (14)</span>';
  });
}

    if(!label) return;
    const profession=label.textContent.trim();
    if(this.checked){
      Object.keys(groups).forEach(k=>{
        if(k!==profession && map.hasLayer(groups[k])) map.removeLayer(groups[k]);
      });
      // Met à jour toutes les cases desktop.
      document.querySelectorAll('.leaflet-control-layers-overlays input').forEach(other=>{
        const l=other.closest('label');
        if(l) other.checked=map.hasLayer(groups[l.textContent.trim()]);
      });
    }
  });
});

// Sur ordinateur : panneau visible. Sur mobile : bouton explicite sous la recherche.
function resizeMap(){setTimeout(()=>map.invalidateSize(),150)} window.addEventListener('resize',resizeMap);

document.getElementById('q').addEventListener('input',function(){
 const q=this.value.toLowerCase().trim();let n=0;
 markers.forEach(m=>{
   const p=m._p,hay=[p.name,p.profession,p.address,p.phone].join(' ').toLowerCase(),ok=!q||hay.includes(q),g=groups[p.profession];
   if(ok){n++;} 
   // Si une couche est active, la recherche filtre ses marqueurs.
   if(map.hasLayer(g)){
      if(ok){if(!g.hasLayer(m))g.addLayer(m)}else{if(g.hasLayer(m))g.removeLayer(m)}
   }
 });
 document.getElementById('count').textContent=n+' professionnel'+(n>1?'s':'')+' correspondant'+(n>1?'s':'');
});
</script>
</body></html>
